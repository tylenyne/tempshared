plugins {
    id "org.jetbrains.kotlin.jvm" version "2.2.0"
    id  'java'
}

group = 'crossxyed'
version = '1.0-SNAPSHOT'

project.ext.lwjglVersion = "3.4.1"
project.ext.lwjglNatives = "natives-windows"
project.ext.skikoVersion = "0.8.19"
project.ext.skikoArch = "x64"


repositories {
    mavenCentral()
    maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
}

dependencies {
    //////////////////SHARED////////////////////////////////////////
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation 'org.jetbrains.skiko:skiko:0.9.37'
    implementation 'dev.romainguy:kotlin-math:1.8.0'

    runtimeOnly 'org.jetbrains.skiko:skiko-awt-runtime-windows-x64:0.9.37'
    //////////////////MAIN/////////////////////////////////////////
    implementation 'it.unimi.dsi:fastutil:8.5.13'

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-jemalloc"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc::$lwjglNatives"

}